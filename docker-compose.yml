# 자체 서버에 설치할 때 사용합니다:  cp .env.example .env  →  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 설정하세요}
      POSTGRES_DB: eum
    volumes:
      - eum-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eum -d eum"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://eum:${POSTGRES_PASSWORD}@db:5432/eum
      JWT_SECRET: ${JWT_SECRET:?.env 에 JWT_SECRET 을 설정하세요}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-0}
      PORT: "4000"
    ports:
      - "${HTTP_PORT:-4000}:4000"
    volumes:
      - eum-storage:/data/storage

volumes:
  eum-db:
  eum-storage:
